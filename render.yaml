services:
  - type: web
    name: supply-chain-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: supply-chain-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: supply-chain-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: supply-chain-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: supply-chain-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: supply-chain-db
          property: password

databases:
  - name: supply-chain-db
    databaseName: supply_chain_db
    user: supplychain_user
    plan: free
    region: singapore
